<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Articles - My Website</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #0f172a;
      color: #ffffff;
      padding: 40px 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 15px;
      border-bottom: 1px solid #334155;
    }

    .header h1 {
      font-size: 28px;
      color: #ffffff;
    }

    .create-btn {
      background-color: #2563eb;
      color: #ffffff;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: bold;
      transition: background 0.2s;
    }

    .create-btn:hover {
      background-color: #1d4ed8;
    }

    .articles-grid {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .article-card {
      background-color: #1e293b;
      padding: 24px;
      border-radius: 8px;
      border: 1px solid #334155;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s, border-color 0.2s;
    }

    .article-card:hover {
      transform: translateY(-2px);
      border-color: #2563eb;
    }

    .article-title {
      font-size: 22px;
      color: #60a5fa;
      margin-bottom: 8px;
      text-decoration: none;
      display: block;
    }

    .article-title:hover {
      text-decoration: underline;
    }

    .article-meta {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 15px;
    }

    .article-excerpt {
      font-size: 15px;
      line-height: 1.6;
      color: #cbd5e1;
      margin-bottom: 18px;
    }

    .read-more-btn {
      display: inline-block;
      color: #38bdf8;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
    }

    .read-more-btn:hover {
      text-decoration: underline;
    }

    .loading, .no-articles {
      text-align: center;
      padding: 40px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Latest Articles</h1>
      <a href="create-post.html" class="create-btn">+ Create Article</a>
    </div>

    <div id="articles-container" class="articles-grid">
      <div class="loading">Loading articles...</div>
    </div>
  </div>

  <script>
    async function fetchArticles() {
      const container = document.getElementById('articles-container');
      try {
        const response = await fetch('https://my-website-api-utxl.onrender.com/api/posts');
        if (!response.ok) throw new Error('Failed to load articles');
        
        const articles = await response.json();

        if (articles.length === 0) {
          container.innerHTML = '<div class="no-articles">No articles published yet.</div>';
          return;
        }

        container.innerHTML = articles.map(article => {
          const words = (article.content || '').split(/\s+/);
          const isLongerThan100 = words.length > 100;
          const excerpt = isLongerThan100 
            ? words.slice(0, 100).join(' ') + '...' 
            : article.content;

          const date = new Date(article.createdAt || Date.now()).toLocaleDateString('en-US', {
            year: 'numeric', month: 'short', day: 'numeric'
          });

          return `
            <div class="article-card">
              <a href="article-detail.html?id=${article._id}" class="article-title">${article.title}</a>
              <div class="article-meta">By <strong>${article.author || 'Anonymous'}</strong> • ${date}</div>
              <p class="article-excerpt">${excerpt}</p>
              <a href="article-detail.html?id=${article._id}" class="read-more-btn">Read Full Article →</a>
            </div>
          `;
        }).join('');

      } catch (err) {
        console.error(err);
        container.innerHTML = '<div class="no-articles" style="color:#f87171;">Failed to load articles. Please refresh the page.</div>';
      }
    }

    fetchArticles();
  </script>
</body>
</html>
