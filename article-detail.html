<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article Detail - My Website</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #0f172a;
      color: #ffffff;
      padding: 40px 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background-color: #1e293b;
      padding: 35px;
      border-radius: 8px;
      border: 1px solid #334155;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }

    .back-btn {
      display: inline-block;
      color: #38bdf8;
      text-decoration: none;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .back-btn:hover {
      text-decoration: underline;
    }

    h1 {
      font-size: 32px;
      color: #60a5fa;
      margin-bottom: 10px;
      line-height: 1.3;
    }

    .meta {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 1px solid #334155;
    }

    .content {
      font-size: 17px;
      line-height: 1.8;
      color: #cbd5e1;
      white-space: pre-line;
    }

    .loading, .error-msg {
      text-align: center;
      padding: 40px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="container" id="main-container">
    <div class="loading">Loading article...</div>
  </div>

  <script>
    async function loadFullArticle() {
      const container = document.getElementById('main-container');
      const urlParams = new URLSearchParams(window.location.search);
      const articleId = urlParams.get('id');

      if (!articleId) {
        container.innerHTML = '<div class="error-msg">No article ID provided. <a href="articles.html" class="back-btn">Return to Articles</a></div>';
        return;
      }

      try {
        const response = await fetch(`https://my-website-api-utxl.onrender.com/api/posts/${articleId}`);
        if (!response.ok) throw new Error('Article not found');
        
        const article = await response.json();

        const date = new Date(article.createdAt || Date.now()).toLocaleDateString('en-US', {
          year: 'numeric', month: 'long', day: 'numeric'
        });

        container.innerHTML = `
          <a href="articles.html" class="back-btn">← Back to Articles</a>
          <h1>${article.title}</h1>
          <div class="meta">By <strong>${article.author || 'Anonymous'}</strong> • Published on ${date}</div>
          <div class="content">${article.content}</div>
        `;

      } catch (err) {
        console.error(err);
        container.innerHTML = '<div class="error-msg" style="color:#f87171;">Failed to load the article. <br><br><a href="articles.html" class="back-btn">← Back to Articles</a></div>';
      }
    }

    loadFullArticle();
  </script>
</body>
</html>
